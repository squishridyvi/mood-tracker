<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Analysis Result</title>
    <link rel="stylesheet" href="style.css">
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let entryText = localStorage.getItem("entryText");
            document.getElementById("entryText").textContent = entryText;
            let scores = JSON.parse(localStorage.getItem("scores"));
            let topEmotion = scores[0];
            document.getElementById("topFace").src = `${topEmotion.label}_face.png`;
            document.getElementById("topFace").alt = topEmotion.label;
            document.getElementById("topEmotion").textContent = `Top Emotion: ${topEmotion.label} (${Math.round(topEmotion.score * 100)}%)`;
            for (let i = 1; i < scores.length; i++) {
                let emotion = scores[i];
                let emotionDiv = document.createElement("div");
                emotionDiv.textContent = `${emotion.label}: ${Math.round(emotion.score * 100)}%`;
                document.getElementById("otherEmotions").appendChild(emotionDiv);
            }
        });
    </script>
</head>
<body>
    <div class="container result-container">
    <h1>Mood Analysis Result</h1>
    <p id="entryText"></p>
    <img id="topFace" src="" alt="Result Image" width="200">
    <h2 id="topEmotion"></h2>
    <div id="otherEmotions"></div>
    <button class="go-back-button" onclick="window.location.href='about.html'"><img src="go_back.png" alt="go back" width="100"></button>
    </div>
</body>
</html>
