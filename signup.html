<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.querySelector(".signup-form").addEventListener("submit", function(e) {
                e.preventDefault();
                // Handling form submission logic 
                const username = document.getElementById("username").value;
                const email = document.getElementById("email").value;
                const password = document.getElementById("password").value;
                // Perform validation and send data to the server or local storage
                if (/[A-Z]/.test(password) && /[a-z]/.test(password) && /[0-9]/.test(password) && password.length >= 8) {
                    // Save user data to local storage or send to server
                    localStorage.setItem("username", username);
                    localStorage.setItem("email", email);
                    alert("Sign up successful!");
                    // Redirect to another page if needed
                    window.location.href = "index.html";
                } else {
                    alert("Password must be at least 8 characters long and include at least one uppercase letter, one lowercase letter, and one number.");
                }
            });
        });
    </script>
</head>
<body>
    <nav class="nav-container">
        <div class="navdiv">
            <!-- right navigation bar -->
            <ul class="left-side">
                <li><a href="index.html">Home</a></li>
            </ul>
            <!-- left -->
            <ul class="right-side">
                <li><a href="signin.html">Sign In </a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
        </div>
    </nav>
    <div class="container">
        <form class="signup-form">
            <div class="login-box">
                <h1>Sign Up</h1>
                <div class="input-box">
                    <span class="icon"><i class="fas fa-user"></i></span>
                    <label>Username</label>
                    <input id="username" type="text" name="username" required placeholder="Enter your username">
                    <label>Email</label>
                    <input id="email" type="email" name="email" required placeholder="Enter a valid email address">
                    <label>Password</label>
                    <input id="password" type="password" name="password" required minlength="8" placeholder="Enter your password"> 
                    <p class="hint">At least 8 characters, 1 uppercase, 1 lowercase, 1 number</p>
                </div>
                    <button type="submit">Sign Up</button>
            </div>
        </form>
    </div>
</body>
</html>
